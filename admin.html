<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MESS DESK — Admin</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
</head>
<body>
  <main class="page">
    <section id="admin-gate" class="card" style="max-width: 420px; margin: 12vh auto 0">
      <h1 class="card-title">Admin console</h1>
      <form id="admin-code-form" class="stack">
        <div class="field"><label for="admin-code">Access code</label><input type="password" id="admin-code" autocomplete="off" required /></div>
        <p class="error-text" id="admin-error" hidden></p>
        <button type="submit" class="btn">Enter</button>
      </form>
      <p class="muted" style="margin-top: 12px"><a href="index.html" style="color: inherit">‹ Back to landing</a></p>
    </section>

    <section id="admin-panel" hidden>
      <div class="page-head">
        <h1>Admin console</h1>
        <span class="muted" id="admin-count"></span>
      </div>
      <section class="card">
        <div class="table-wrap">
          <table class="table" id="admin-table">
            <thead><tr><th>Mess</th><th>ID</th><th class="num">Members</th><th>Created</th><th>Last activity</th><th>Status</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="muted empty-note" id="admin-empty" hidden>No messes yet.</p>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/ui/admin.js"></script>
</body>
</html>
