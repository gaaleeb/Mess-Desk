<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MESS DESK — Log in</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 20px 14px; }
    .auth-card { width: min(440px, 100%); }
    .back { margin-bottom: 14px; }
    .auth-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <section class="card auth-card" aria-labelledby="login-title">
      <a class="icon-back back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1 class="card-title" id="login-title">Log in</h1>
      <form id="login-form" class="stack" novalidate>
        <div class="field"><label for="login-mess-id">Mess ID</label><input type="text" id="login-mess-id" placeholder="MESS-XXXXXX" required autocomplete="off" /></div>
        <div class="field"><label for="login-name">Your name</label><input type="text" id="login-name" maxlength="30" required autocomplete="off" /></div>
        <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" required /></div>
        <p class="error-text" id="login-error" hidden></p>
        <button type="submit" class="btn">Log in</button>
      </form>
      <div class="auth-foot">
        <button class="linklike" id="seed-demo-btn" type="button">Load demo data</button>
        <a class="linklike" href="admin.html">Admin</a>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/ui/login.js"></script>
</body>
</html>
